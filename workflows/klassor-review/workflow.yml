    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      width: 244
      height: 100
      position:
        x: 0
        y: 200
      positionAbsolute:
        x: 0
        y: 200
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
