          max_length: 200
          options: []
          hint: ''
          placeholder: ''
          hide: false
        - variable: request_text
          label: متن اصلی درخواست
          type: paragraph
          required: true
          default: ''
          max_length: 6000
          options: []
          hint: ''
          placeholder: ''
          hide: false
        - variable: sources_text
          label: متن مستندات مرتبط (اختیاری)
          type: paragraph
          required: false
          default: ''
          max_length: 8000
          options: []
