kind: app
dependencies: []
app:
  name: تحلیل، بررسی و برنامه‌ریزی کلاسور
  description: تأیید نسخهٔ نیازمندی و منابع توسط انسان، سپس تهیهٔ پیش‌نویس برای گفت‌وگو با TL و توسعه‌دهنده؛ بدون
