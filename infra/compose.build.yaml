# Paths are relative to the included upstream docker/ project directory.
services:
  api:
    build:
      context: ../../company-api-source
  web:
    build:
      context: ../../dify-web-source
      dockerfile: .company-web/Dockerfile
      args:
        KARA_NPM_REGISTRY: ${KARA_NPM_REGISTRY:-https://registry.npmjs.org/}
        KARA_TOOLS_IMAGE: ${KARA_TOOLS_IMAGE:-python:3.12-bookworm}
  # Start the local stack even without COMPOSE_PROFILES in the host shell.
  db_postgres:
    profiles: !reset []
  weaviate:
    profiles: !reset []
  api_websocket:
    profiles: !reset []
