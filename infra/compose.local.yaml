# Compose 2.24.4+ supports !override and optional env_file entries.
services:
  api:
    depends_on:
      migration:
        condition: service_completed_successfully
    image: company-agent/dify-api:1.17.1-projects
    pull_policy: never
    environment:
      CODE_EXECUTION_API_KEY: "${SANDBOX_API_KEY:?Private sandbox key is required}"
      KARA_TEAM_ARTIFACT_MAX_BYTES: "${KARA_TEAM_ARTIFACT_MAX_BYTES:-262144}"
      KARA_TEAM_STAGE_RETRY_LIMIT: "${KARA_TEAM_STAGE_RETRY_LIMIT:-3}"
      KARA_TEAM_RECOVERY_AFTER_SECONDS: "${KARA_TEAM_RECOVERY_AFTER_SECONDS:-900}"
  worker:
    depends_on:
      migration:
        condition: service_completed_successfully
    image: company-agent/dify-api:1.17.1-projects
    pull_policy: never
    environment:
      CODE_EXECUTION_API_KEY: "${SANDBOX_API_KEY:?Private sandbox key is required}"
      KARA_TEAM_ARTIFACT_MAX_BYTES: "${KARA_TEAM_ARTIFACT_MAX_BYTES:-262144}"
      KARA_TEAM_STAGE_RETRY_LIMIT: "${KARA_TEAM_STAGE_RETRY_LIMIT:-3}"
      KARA_TEAM_RECOVERY_AFTER_SECONDS: "${KARA_TEAM_RECOVERY_AFTER_SECONDS:-900}"
  worker_beat:
    depends_on:
      migration:
        condition: service_completed_successfully
    image: company-agent/dify-api:1.17.1-projects
    pull_policy: never
    environment:
      CODE_EXECUTION_API_KEY: "${SANDBOX_API_KEY:?Private sandbox key is required}"
  api_websocket:
    depends_on:
      migration:
        condition: service_completed_successfully
    image: company-agent/dify-api:1.17.1-projects
    pull_policy: never
  nginx:
    depends_on:
      api:
        condition: service_started
        restart: true
      web:
        condition: service_started
        restart: true
      api_websocket:
        condition: service_started
        required: false
        restart: true
    ports: !override
      - "${KARA_BIND_ADDRESS:-127.0.0.1}:${EXPOSE_NGINX_PORT:-8080}:80"
      - "${KARA_BIND_ADDRESS:-127.0.0.1}:${EXPOSE_NGINX_SSL_PORT:-8443}:443"
  plugin_daemon:
    ports: !override
      - "127.0.0.1:${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:5003"
  web:
    image: company-agent/dify-web:1.17.1-fa
    pull_policy: never
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPERIMENTAL_ENABLE_VINEXT: "false"
  weaviate:
    image: ${DIFY_WEAVIATE_IMAGE:-cr.weaviate.io/semitechnologies/weaviate:1.39.2}
    environment:
      DISABLE_TELEMETRY: "true"

  # Use the unmodified engine: importing Kara before the base schema exists fails.
  migration:
    extends:
      service: api
    # extends sees this override's api, not the merged upstream environment.
    # Both launch paths resolve relative files from .runtime/dify/docker.
    env_file:
      - .env
    image: langgenius/dify-api:1.17.1
    build: !reset null
    pull_policy: if_not_present
    restart: "no"
    profiles: !reset []
    entrypoint: ["/app/api/.venv/bin/flask"]
    command: ["db", "upgrade"]
    working_dir: /app/api
    depends_on: !override
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      disable: true
